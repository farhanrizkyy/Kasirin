name: Build Kasirin
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Buat kerangka Android otomatis
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml; cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org id.kasirin --project-name kasirin .
          cp /tmp/pubspec.yaml pubspec.yaml; cp /tmp/main.dart lib/main.dart
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Kasirin"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Pasang ikon Kasirin
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: kasirin-apk
          path: build/app/outputs/flutter-apk/*.apk
