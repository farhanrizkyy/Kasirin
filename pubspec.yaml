name: kasirin
description: Kasirin - aplikasi kasir untuk UMKM, warung grosir dan kelontong.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#0E0E10"
  adaptive_icon_foreground: assets/logo_fg.png
